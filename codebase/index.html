<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020617">
  <title>TA Copilot — Quản lý câu hỏi Discord (MVP)</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="header-inner">
      <a class="brand" href="./">
        <span class="brand-mark">TA</span>
        <div>
          <h1>TA Copilot <span>Track B2 (MVP)</span></h1>
          <p>Gom câu hỏi tồn &gt;4h · AI đề xuất câu trả lời · TA sửa và duyệt</p>
        </div>
      </a>
      <div class="header-status"><span class="status-dot"></span><span>Local sync · support inbox</span></div>
      <div class="header-actions">
        <button class="button scan-button" id="scan-button">⚡ Đọc lại dữ liệu</button>
      </div>
    </div>
  </header>

  <main>
    <div class="scan-progress" id="scan-progress" hidden><div></div></div>

    <section id="inbox">
      <div class="inbox-heading" style="margin-bottom: 20px;">
        <div>
          <h2 id="list-title">Hộp thư câu hỏi tồn</h2>
          <p id="backlog-counter" style="color: #94a3b8; font-size: 14px; margin-top: 4px; font-weight: 500;">Đang tải danh sách câu hỏi...</p>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <select id="sort" class="select" aria-label="Sắp xếp" style="background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(148, 163, 184, 0.2); color: #e2e8f0; padding: 7px 12px; border-radius: 8px; font-size: 13px;">
            <option value="longest">Chờ lâu nhất trước</option>
            <option value="newest">Mới nhất trước</option>
          </select>
          <label class="search">
            <span>⌕</span>
            <input id="search" type="search" placeholder="Tìm câu hỏi, học viên..." aria-label="Tìm câu hỏi">
            <kbd>/</kbd>
          </label>
        </div>
      </div>

      <div class="question-list" id="questions-container"></div>
      <footer class="list-footer" style="margin-top: 24px;">
        <span id="result-count"></span>
        <span>Phản hồi lưu trong phiên mô phỏng · sẵn sàng gửi Discord</span>
      </footer>
    </section>

    <footer class="page-footer">TA Copilot MVP · CSV đã ẩn danh</footer>
  </main>

  <!-- Modal đơn giản xem ngữ cảnh context thread -->
  <dialog id="thread-dialog" aria-labelledby="dialog-title">
    <div class="dialog-top">
      <span id="dialog-header-title">NGỮ CẢNH DISCORD THREAD</span>
      <button class="icon-button" id="close-dialog" aria-label="Đóng">×</button>
    </div>
    <div id="dialog-content"></div>
    <div class="dialog-actions" style="margin-top: 20px; display: flex; justify-content: flex-end;">
      <button class="button" id="dialog-close-btn">Đóng</button>
    </div>
  </dialog>

  <div id="toast" role="status" hidden></div>
</body>
</html>
